set timeout=10

# Standard = LLMEng Workstation
set default="1"

insmod part_gpt
insmod ext2
insmod fat

set initial_root=$root

# Suche nach der Datei und setze root
# Wenn gefunden, ändere den default auf den lokalen Boot (Eintrag 0)
if search --no-floppy --file --set=root /boot/lernvirt-installed; then
    set default="0"
fi

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# Menüeintrag 0
menuentry "Local boot" {
    configfile ($root)/boot/grub/grub.cfg
}

# Menüeintrag 1
menuentry "Install Ubuntu (LLMEng Workstation)" {
  set root=$initial_root
  set gfxpayload=keep
  linux   /casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud.k3sws/ ---
  initrd  /casper/initrd
}

# Menüeintrag 2
menuentry "Debug-Shell (busybox)" {
    set root=$initial_root
    set gfxpayload=keep
    linux   /casper/vmlinuz break ---
    initrd  /casper/initrd
}